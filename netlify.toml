[[redirects]]
  from = "https://ac-magnifying-tool.netlify.app/*"
  to = "https://magnify.abcx.fyi/:splat"
  status = 301
  force = true
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"